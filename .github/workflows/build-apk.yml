name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # lets the job attach the APK to a GitHub Release when you push a tag like v1.0.0

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The public URL of your deployed backend, e.g. https://my-site.netlify.app
      # Set it under: Settings > Secrets and variables > Actions > Variables > "API_BASE_URL"
      VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Check API address
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::warning title=API_BASE_URL is not set::The APK will build, but the app will have no backend to talk to. Add a repository variable named API_BASE_URL and re-run this workflow."
          else
            echo "App will use API: $VITE_API_BASE_URL"
          fi

      - name: Build web app
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Create Android project
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          npm run copy:web
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk dist/nemotron-workbench.apk
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nemotron-workbench-apk
          path: dist/nemotron-workbench.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/nemotron-workbench.apk
          generate_release_notes: true
