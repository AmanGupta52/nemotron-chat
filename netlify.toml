# Netlify hosts the WEBSITE only. The API runs on Render (see render.yaml).
# Set the environment variable VITE_API_BASE_URL (your Render URL) in Netlify before deploying.
[build]
  base = "web"
  command = "npm install --no-audit --no-fund && npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
