<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0e13" />
    <meta name="description" content="A responsive AI chat workspace for NVIDIA and free OpenRouter models." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%23a6e77b%27/%3E%3Cpath d=%27M16 7l2.2 6.8L25 16l-6.8 2.2L16 25l-2.2-6.8L7 16l6.8-2.2z%27 fill=%27%2310160d%27/%3E%3C/svg%3E" />
    <title>Nemotron Workbench</title>
    <style>
      html, body { margin: 0; background: #0b0e13; }
      .boot { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; font-family: "DM Sans", system-ui, sans-serif; color: #e8edf5; background: #0b0e13; }
      .boot-mark { width: 68px; height: 68px; border-radius: 22px; display: grid; place-items: center; background: #a6e77b; color: #10160d; animation: boot-pop 1.6s ease-in-out infinite; box-shadow: 0 14px 40px rgba(166, 231, 123, 0.35); }
      .boot-name { font-weight: 800; font-size: 22px; letter-spacing: -0.03em; }
      .boot-name span { color: #8f9bab; font-weight: 700; }
      .boot-bar { width: 200px; max-width: 60vw; height: 4px; border-radius: 999px; overflow: hidden; background: rgba(166, 181, 202, 0.18); }
      .boot-bar i { display: block; width: 40%; height: 100%; background: #a6e77b; border-radius: inherit; animation: boot-slide 1.1s ease-in-out infinite; }
      @keyframes boot-pop { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
      @keyframes boot-slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
      @media (prefers-color-scheme: light) { html, body, .boot { background: #f6f7f9; color: #16202c; } .boot-mark { background: #3f8f16; color: #fff; box-shadow: 0 14px 40px rgba(63, 143, 22, 0.3); } .boot-bar { background: rgba(20, 30, 45, 0.12); } .boot-bar i { background: #3f8f16; } .boot-name span { color: #5d6b7c; } }
      @media (prefers-reduced-motion: reduce) { .boot-mark, .boot-bar i { animation: none; } }
    </style>
  </head>
  <body>
        <div id="root">
      <div class="boot" role="status" aria-label="Loading">
        <div class="boot-mark"><svg viewBox="0 0 32 32" width="34" height="34"><path d="M16 6l2.6 7.4L26 16l-7.4 2.6L16 26l-2.6-7.4L6 16l7.4-2.6z" fill="currentColor"/></svg></div>
        <div class="boot-name">Nemotron<span> Workbench</span></div>
        <div class="boot-bar"><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
